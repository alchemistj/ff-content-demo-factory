name: Resume Gate 1 from Cursor terminal receipt

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: factory-cursor-handoff-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'cursor[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve the authoritative PR head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid)"
          echo "branch=$(printf '%s' "$pr_json" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
          echo "head=$(printf '%s' "$pr_json" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
      - name: Checkout the immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.target.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - name: Parse terminal receipt binding before locating dispatch
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          mkdir -p canary/phase-a
          printf '%s' "$COMMENT_BODY" > canary/phase-a/cursor-terminal-comment.md
          node scripts/parse-cursor-terminal-comment.js canary/phase-a/cursor-terminal-comment.md "$AUTHOR_LOGIN" "$COMMENT_ID" "$COMMENT_URL" > canary/phase-a/terminal-binding.json
      - name: Retrieve the phase-A dispatch and pending artifact automatically
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          mkdir -p canary/phase-a
          test "$ISSUE_NUMBER" = '1'
          dispatch_issue='8'
          execution_issue='1'
          echo "FACTORY_DISPATCH_ISSUE_NUMBER=$dispatch_issue" >> "$GITHUB_ENV"
          GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$execution_issue/comments?per_page=100" > canary/phase-a/dispatch-comments.json
          expected="$(REPOSITORY="$REPOSITORY" BRANCH="${{ steps.target.outputs.branch }}" HEAD="${{ steps.target.outputs.head }}" BINDING_FILE=canary/phase-a/terminal-binding.json node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.env.BINDING_FILE,'utf8'));process.stdout.write(JSON.stringify({repository:process.env.REPOSITORY,prNumber:'1',branch:process.env.BRANCH,reviewedHead:process.env.HEAD,handoffId:b.handoffId,dispatchKey:b.dispatchKey,dispatchDigest:b.dispatchDigest,phaseARunId:b.phaseARunId,inputManifestDigest:b.inputManifestDigest,sourceCheckpointDigest:b.sourceCheckpointDigest,sourceManifestDigest:b.sourceManifestDigest,jobDigest:b.dispatchDigest}))")"
          dispatch_json="$(node scripts/select-cursor-dispatch-comment.js canary/phase-a/dispatch-comments.json "$expected")"
          printf '%s\n' "$dispatch_json" > canary/phase-a/dispatch.json
          phase_run="$(DISPATCH_JSON="$dispatch_json" node -e "const {markerValue}=require('./scripts/select-cursor-dispatch-comment');process.stdout.write(markerValue(JSON.parse(process.env.DISPATCH_JSON).body,'Phase-A run')||'')")"
          test -n "$phase_run"
          binding_phase_run="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('canary/phase-a/terminal-binding.json','utf8')).phaseARunId||''))")"
          if [ -n "$binding_phase_run" ] && [ "$phase_run" != "$binding_phase_run" ]; then echo 'terminal receipt phase-A run does not match dispatch'; exit 1; fi
          gh run download "$phase_run" --repo "$GITHUB_REPOSITORY" --name "current-head-gate1-canary-$phase_run" --dir canary/phase-a
          test -f canary/phase-a/current-head-gate1-pending.json
          dispatch_run="$(DISPATCH_JSON="$dispatch_json" node -e "const {markerValue}=require('./scripts/select-cursor-dispatch-comment');process.stdout.write(markerValue(JSON.parse(process.env.DISPATCH_JSON).body,'Dispatch workflow run')||'')")"
          test -n "$dispatch_run"
          gh run download "$dispatch_run" --repo "$GITHUB_REPOSITORY" --name "cursor-cloud-agent-dispatch-$dispatch_run" --dir canary/phase-a/dispatch
          GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$dispatch_issue/comments?per_page=100" > canary/phase-a/ledger-comments.json
          REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$dispatch_issue" PENDING_FILE=canary/phase-a/current-head-gate1-pending.json LEDGER_FILE=canary/phase-a/ledger-comments.json node - <<'NODE'
          const fs = require('node:fs'); const { findClaim } = require('./src/factory/github-ledger');
          const pending = JSON.parse(fs.readFileSync(process.env.PENDING_FILE)); const comments = JSON.parse(fs.readFileSync(process.env.LEDGER_FILE));
          const claim = findClaim(comments, { repository: process.env.REPOSITORY, issueNumber: '8', prNumber: '1', branch: pending.dispatchPacket.branch, checkedOutSha: pending.envelope.checkedOutSha, kind: 'dispatch', handoffId: pending.handoffId, dispatchKey: pending.envelope.dispatchKey, dispatchDigest: pending.envelope.dispatchDigest, runId: pending.envelope.runId, prospectId: pending.envelope.prospectId, sourceCheckpointDigest: pending.envelope.sourceCheckpointDigest, sourceManifestDigest: pending.envelope.sourceManifestDigest, inputManifestDigest: pending.envelope.inputManifestDigest, jobId: pending.phaseARunId, resultId: pending.envelope.dispatchDigest });
          if (!claim) throw new Error('Authoritative durable dispatch ledger marker is missing or mismatched');
          NODE
      - name: Validate terminal result before consuming durable resume claim
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          FACTORY_STRICT_TERMINAL_BINDING: 'true'
        run: |
          test -n "$GH_TOKEN"
          printf '%s' "$COMMENT_BODY" > canary/phase-a/cursor-terminal-comment.md
          node src/collect-cursor-terminal-result.js canary/phase-a/current-head-gate1-pending.json canary/phase-a/cursor-terminal-comment.md canary/phase-a/cursor-terminal-result.json "$AUTHOR_LOGIN" "$COMMENT_ID" "$COMMENT_URL"
      - name: Execute terminal dedupe and crash-recovery guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ env.FACTORY_DISPATCH_ISSUE_NUMBER }}
        run: |
          test -n "$GH_TOKEN"
          GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > canary/phase-a/ledger-comments-before-resume.json
          node scripts/cursor-handoff-recovery.js canary/phase-a/current-head-gate1-pending.json canary/phase-a/cursor-terminal-result.json canary/phase-a/ledger-comments-before-resume.json > canary/phase-a/recovery-decision.json
          node scripts/apply-cursor-recovery-decision.js canary/phase-a/current-head-gate1-pending.json canary/phase-a/cursor-terminal-result.json canary/phase-a/ledger-comments-before-resume.json canary/phase-a/recovery-decision.json canary/phase-a
      - name: Post recovery transitions from the sealed decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.FACTORY_DISPATCH_ISSUE_NUMBER }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          state="canary/phase-a/recovery-state.json"
          action="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('$state','utf8')).next||'')")"
          if [ "$action" = 'post-in-motion-terminal-and-phase-b' ]; then
            GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-in-motion-ledger-marker.md)"
            GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-resume-ledger-marker.md)"
            GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-phase-b-claim.md)"
          elif [ "$action" = 'post-terminal-and-phase-b' ]; then
            GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-resume-ledger-marker.md)"
            GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-phase-b-claim.md)"
          elif [ "$action" = 'post-phase-b' ]; then
            GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-phase-b-claim.md)"
          fi
          decision_action="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/recovery-state.json','utf8')).action)")"
          echo "FACTORY_RECOVERY_ACTION=$decision_action" >> "$GITHUB_ENV"
          case "$decision_action" in
            noop) echo 'FACTORY_RESUME_ALREADY_CLAIMED=true' >> "$GITHUB_ENV"; echo 'FACTORY_RECOVERY_DECISION_APPLIED=true' >> "$GITHUB_ENV" ;;
            recover-phase-b) echo 'FACTORY_RECOVERY_DECISION_APPLIED=true' >> "$GITHUB_ENV" ;;
            recover-prepared|recover-accepted) echo 'FACTORY_PHASE_B_RECOVERY=true' >> "$GITHUB_ENV"; echo 'FACTORY_RECOVERY_DECISION_APPLIED=true' >> "$GITHUB_ENV" ;;
            resume-phase-b) echo 'FACTORY_TERMINAL_ALREADY_RECORDED=true' >> "$GITHUB_ENV"; echo 'FACTORY_RECOVERY_DECISION_APPLIED=true' >> "$GITHUB_ENV" ;;
            *) echo 'FACTORY_RECOVERY_DECISION_APPLIED=true' >> "$GITHUB_ENV" ;;
          esac
      - name: Record in-motion ledger state after validated Cursor receipt
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.FACTORY_DISPATCH_ISSUE_NUMBER }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > canary/phase-a/ledger-comments-current.json
          LEDGER_FILE=canary/phase-a/ledger-comments-current.json REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$ISSUE_NUMBER" node - <<'NODE'
          const fs=require('node:fs'); const { markerFor, markerBody, assertTransition, findClaim, findTerminalOutcome, terminalOutcomeKey }=require('./src/factory/github-ledger');
          const p=JSON.parse(fs.readFileSync('canary/phase-a/current-head-gate1-pending.json','utf8')); const result=JSON.parse(fs.readFileSync('canary/phase-a/cursor-terminal-result.json','utf8')); const comments=JSON.parse(fs.readFileSync(process.env.LEDGER_FILE));
          const outcome={repository:process.env.REPOSITORY,issueNumber:'8',prNumber:'1',branch:p.dispatchPacket.branch,checkedOutSha:p.envelope.checkedOutSha,kind:'resume',handoffId:p.handoffId,dispatchKey:p.envelope.dispatchKey,dispatchDigest:p.envelope.dispatchDigest,runId:p.envelope.runId,prospectId:p.envelope.prospectId,sourceCheckpointDigest:p.envelope.sourceCheckpointDigest,sourceManifestDigest:p.envelope.sourceManifestDigest,inputManifestDigest:p.envelope.inputManifestDigest,jobId:p.phaseARunId,inputDigest:result.receipt.inputDigest,outputDigest:result.receipt.outputDigest};
          const ownerToken=terminalOutcomeKey(outcome); const context={...outcome,ownerToken,resultId:ownerToken};
          const existing=findTerminalOutcome(comments,outcome);
          if (existing?.status === 'resumed') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_RESUME_ALREADY_CLAIMED=true\n'); process.exit(0); }
          if (existing?.status === 'phase_b_claimed') { fs.writeFileSync('canary/phase-a/terminal-already-recorded','true'); fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_PHASE_B_RECOVERY=true\nFACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          if (existing?.status === 'terminal') { fs.writeFileSync('canary/phase-a/terminal-already-recorded','true'); fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          const prior=findClaim(comments,context) || existing;
          if (prior && prior.status === 'resumed') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_RESUME_ALREADY_CLAIMED=true\n'); process.exit(0); }
          if (prior && prior.status === 'phase_b_claimed') { fs.writeFileSync('canary/phase-a/terminal-already-recorded','true'); fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_PHASE_B_RECOVERY=true\nFACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          if (prior && prior.status === 'in_motion') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_IN_MOTION_RECOVERY=true\n'); process.exit(0); }
          if (prior && prior.status === 'terminal') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          const posted=findClaim(comments,{...context,kind:'dispatch',ownerToken:p.envelope.dispatchKey,handoffId:p.handoffId,dispatchKey:p.envelope.dispatchKey,dispatchDigest:p.envelope.dispatchDigest,resultId:p.envelope.dispatchDigest,status:'posted'});
          if (!posted || !posted.commentId || !posted.commentUrl) throw new Error('Authoritative dispatch marker was not reconciled before in_motion');
          const marker=markerFor({kind:'resume',...context,threadUrl:result.receipt.threadUrl,model:result.bundle.model,commentId:result.commentId,commentUrl:result.commentUrl,status:'in_motion'});
          assertTransition({ ...marker, status:'posted' }, marker); fs.writeFileSync('canary/phase-a/cursor-in-motion-ledger-marker.md',markerBody(marker));
          NODE
          if [ "${FACTORY_RESUME_ALREADY_CLAIMED:-false}" = 'true' ]; then exit 0; fi
          if [ "${FACTORY_IN_MOTION_RECOVERY:-false}" = 'true' ]; then exit 0; fi
          if [ "${FACTORY_TERMINAL_ALREADY_RECORDED:-false}" = 'true' ]; then exit 0; fi
          GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-in-motion-ledger-marker.md)"
      - name: Consume durable resume ledger claim after validation
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.FACTORY_DISPATCH_ISSUE_NUMBER }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          handoff_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/current-head-gate1-pending.json','utf8')).handoffId)")"
          dispatch_key="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/current-head-gate1-pending.json','utf8')).envelope.dispatchKey)")"
          comments="$(GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          LEDGER_COMMENTS="$comments" REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$ISSUE_NUMBER" HANDOFF_ID="$handoff_id" DISPATCH_KEY="$dispatch_key" RESULT_ID="$COMMENT_ID" node - <<'NODE'
          const fs = require('node:fs'); const { markerFor, markerBody, findClaim, findTerminalOutcome, terminalOutcomeKey } = require('./src/factory/github-ledger');
          const result = JSON.parse(fs.readFileSync('canary/phase-a/cursor-terminal-result.json','utf8'));
          const outcome = { repository: process.env.REPOSITORY, issueNumber: '8', prNumber: '1', branch: result.pending.dispatchPacket.branch, checkedOutSha: result.pending.envelope.checkedOutSha, kind: 'resume', handoffId: process.env.HANDOFF_ID, dispatchKey: process.env.DISPATCH_KEY, dispatchDigest: result.pending.envelope.dispatchDigest, runId: result.pending.envelope.runId, prospectId: result.pending.envelope.prospectId, sourceCheckpointDigest: result.pending.envelope.sourceCheckpointDigest, sourceManifestDigest: result.pending.envelope.sourceManifestDigest, inputManifestDigest: result.pending.envelope.inputManifestDigest, jobId: result.pending.phaseARunId, inputDigest: result.receipt.inputDigest, outputDigest: result.receipt.outputDigest };
          const ownerToken = terminalOutcomeKey(outcome);
          const expected = { ...outcome, ownerToken, resultId: ownerToken };
          const existing = findTerminalOutcome(comments, outcome);
          if (existing?.status === 'resumed') { fs.writeFileSync('canary/phase-a/resume-already-claimed', 'true'); fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_RESUME_ALREADY_CLAIMED=true\n'); process.exit(0); }
          if (existing?.status === 'phase_b_claimed') { fs.writeFileSync('canary/phase-a/terminal-already-recorded', 'true'); fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_PHASE_B_RECOVERY=true\nFACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          if (existing?.status === 'terminal') { fs.writeFileSync('canary/phase-a/terminal-already-recorded', 'true'); fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          const prior = findClaim(comments, expected);
          if (prior && prior.status === 'resumed') { fs.writeFileSync('canary/phase-a/resume-already-claimed', 'true'); fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_RESUME_ALREADY_CLAIMED=true\n'); process.exit(0); }
          if (prior && prior.status === 'phase_b_claimed') { fs.writeFileSync('canary/phase-a/phase-b-claimed-recovery', 'true'); fs.writeFileSync('canary/phase-a/terminal-already-recorded','true'); fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_PHASE_B_RECOVERY=true\nFACTORY_TERMINAL_ALREADY_RECORDED=true\n'); process.exit(0); }
          if (prior && prior.status === 'terminal') { fs.writeFileSync('canary/phase-a/terminal-already-recorded', 'true'); process.exit(0); }
          const { assertTransition } = require('./src/factory/github-ledger');
          const marker = markerFor({ kind: 'resume', ...expected, commentId: result.commentId, commentUrl: result.commentUrl, threadUrl: result.receipt.threadUrl, model: result.bundle.model, status: 'terminal' });
          assertTransition({ ...marker, status: 'in_motion' }, marker);
          fs.writeFileSync('canary/phase-a/cursor-resume-ledger-marker.md', markerBody(marker));
          NODE
          if [ -f canary/phase-a/resume-already-claimed ] || [ -f canary/phase-a/terminal-already-recorded ]; then exit 0; fi
          GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-resume-ledger-marker.md)"
      - name: Claim durable GitHub phase-B CAS before phase-B work
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ env.FACTORY_DISPATCH_ISSUE_NUMBER }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          comments="$(GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          LEDGER_COMMENTS="$comments" REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$ISSUE_NUMBER" COMMENT_ID="$COMMENT_ID" COMMENT_URL="$COMMENT_URL" node - <<'NODE'
          const fs=require('node:fs'); const { markerFor, markerBody, assertTransition, findClaim, findTerminalOutcome, terminalOutcomeKey }=require('./src/factory/github-ledger');
          const p=JSON.parse(fs.readFileSync('canary/phase-a/current-head-gate1-pending.json','utf8')); const result=JSON.parse(fs.readFileSync('canary/phase-a/cursor-terminal-result.json','utf8')); const comments=JSON.parse(process.env.LEDGER_COMMENTS);
          const outcome={repository:process.env.REPOSITORY,issueNumber:'8',prNumber:'1',branch:p.dispatchPacket.branch,checkedOutSha:p.envelope.checkedOutSha,kind:'resume',handoffId:p.handoffId,dispatchKey:p.envelope.dispatchKey,dispatchDigest:p.envelope.dispatchDigest,runId:p.envelope.runId,prospectId:p.envelope.prospectId,sourceCheckpointDigest:p.envelope.sourceCheckpointDigest,sourceManifestDigest:p.envelope.sourceManifestDigest,inputManifestDigest:p.envelope.inputManifestDigest,jobId:p.phaseARunId,inputDigest:result.receipt.inputDigest,outputDigest:result.receipt.outputDigest};
          const ownerToken=terminalOutcomeKey(outcome); const context={...outcome,ownerToken,resultId:ownerToken};
          const existing=findTerminalOutcome(comments,outcome);
          if (existing?.status === 'resumed') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_RESUME_ALREADY_CLAIMED=true\n'); process.exit(0); }
          if (existing?.status === 'phase_b_claimed') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_PHASE_B_RECOVERY=true\n'); process.exit(0); }
          const prior=findClaim(comments,context) || existing;
          if (prior && prior.status === 'resumed') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_RESUME_ALREADY_CLAIMED=true\n'); process.exit(0); }
          if (prior && prior.status === 'phase_b_claimed') { fs.appendFileSync(process.env.GITHUB_ENV,'FACTORY_PHASE_B_RECOVERY=true\n'); process.exit(0); }
          if (!prior || prior.status !== 'terminal') throw new Error('Durable terminal ledger state is required before claiming phase B');
          const marker=markerFor({kind:'resume',...context,threadUrl:result.receipt.threadUrl,model:result.bundle.model,commentId:process.env.COMMENT_ID,commentUrl:process.env.COMMENT_URL,status:'phase_b_claimed'});
          assertTransition(prior,marker); fs.writeFileSync('canary/phase-a/cursor-phase-b-claim.md',markerBody(marker));
          NODE
          if [ "${FACTORY_RESUME_ALREADY_CLAIMED:-false}" = 'true' ]; then exit 0; fi
          if [ "${FACTORY_PHASE_B_RECOVERY:-false}" = 'true' ]; then exit 0; fi
          GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-phase-b-claim.md)"
      - name: Restore durable paid receipts before phase-B recovery
        if: env.FACTORY_RECOVERY_ACTION == 'recover-accepted'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          mkdir -p canary/phase-b/receipt-archive
          artifacts="$(GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/actions/artifacts?per_page=100")"
          expected="$(node -e "const d=JSON.parse(require('fs').readFileSync('canary/phase-a/recovery-decision.json','utf8'));const x=d.existing||{};process.stdout.write(JSON.stringify({name:x.artifactName,id:x.artifactId,digest:x.artifactDigest,contentDigest:x.artifactContentDigest,handoffId:x.handoffId,dispatchKey:x.dispatchKey,outputDigest:x.outputDigest,phaseARunId:x.jobId}))")"
          artifact_id="$(ARTIFACTS="$artifacts" EXPECTED="$expected" node -e "const {selectExactArtifact}=require('./scripts/restore-paid-receipts');const e=JSON.parse(process.env.EXPECTED);const x=selectExactArtifact(JSON.parse(process.env.ARTIFACTS).artifacts||[],e);process.stdout.write(String(x.id))")"
          GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > canary/phase-b/receipt-archive/phase-b.zip
          unzip -q canary/phase-b/receipt-archive/phase-b.zip -d canary/phase-b/receipt-archive/extracted
          snapshot="$(find canary/phase-b/receipt-archive/extracted -name paid-receipt-artifact.json -type f -print -quit)"
          if [ -z "$snapshot" ]; then snapshot="$(find canary/phase-b/receipt-archive/extracted -name vendor-receipts.json -type f -print -quit)"; fi
          test -n "$snapshot"
