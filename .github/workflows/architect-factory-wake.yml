name: Architect-operated factory wake

on:
  push:
    branches:
      - architect/canary-execution
    paths:
      - .factory-wake/control.json

permissions:
  actions: read
  contents: read

concurrency:
  group: architect-factory-capacity-one
  cancel-in-progress: false

jobs:
  run-one:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Read Architect wake control
        id: control
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const control = require('./.factory-wake/control.json');
          const lines = [
            `mode=${control.mode}`,
            `wake_id=${control.wakeId}`,
            `restore_run_id=${control.restoreFromRunId || ''}`,
            `allow_legacy_restore=${Boolean(control.allowLegacyRestore)}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
          NODE

      - name: Validate secret-backed runtime
        shell: bash
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
        run: |
          test -n "$APIFY_API_TOKEN"
          test -n "$CURSOR_API_KEY"
          test "$CURSOR_MODEL" = "cursor-grok-4.6-high"

      - name: Install factory dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore previous capacity-one checkpoint
        id: restore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.control.outputs.mode }}
          RESTORE_RUN_ID: ${{ steps.control.outputs.restore_run_id }}
          ALLOW_LEGACY_RESTORE: ${{ steps.control.outputs.allow_legacy_restore }}
        run: |
          if [ -z "$RESTORE_RUN_ID" ]; then
            if [ "$MODE" = "stage1" ]; then
              echo "restored=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Mode $MODE requires an explicit restoreFromRunId" >&2
            exit 1
          fi

          mkdir -p .factory-checkpoint
          gh run download "$RESTORE_RUN_ID" \
            --name "factory-checkpoint-$RESTORE_RUN_ID" \
            --dir .factory-checkpoint
          test -d .factory-checkpoint/state
          test -f .factory-checkpoint/canary/outputs/manifest.sha256

          if [ "$ALLOW_LEGACY_RESTORE" = "true" ]; then
            (cd .factory-checkpoint && grep -v 'canary/outputs/manifest.sha256$' canary/outputs/manifest.sha256 | sha256sum -c -)
          else
            test -f .factory-checkpoint/canary/outputs/checkpoint.json
            RESTORE_RUN_ID="$RESTORE_RUN_ID" node <<'NODE'
          const fs = require('node:fs');
          const checkpoint = JSON.parse(fs.readFileSync('.factory-checkpoint/canary/outputs/checkpoint.json', 'utf8'));
          if (String(checkpoint.runId) !== String(process.env.RESTORE_RUN_ID)) {
            throw new Error('Checkpoint run identity mismatch');
          }
          NODE
            (cd .factory-checkpoint && sha256sum -c canary/outputs/manifest.sha256)
          fi

          cp -R .factory-checkpoint/state ./state
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Run exactly one Architect-directed cycle
        id: factory
        continue-on-error: true
        shell: bash
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          MODE: ${{ steps.control.outputs.mode }}
          WAKE_ID: ${{ steps.control.outputs.wake_id }}
        run: |
          mkdir -p canary/outputs
          seed="$(node -p "require('./.factory-wake/control.json').seedDiscovery || ''")"
          set +e
          case "$MODE" in
            stage1)
              node src/run-one.js --production --seed-discovery "$seed" --json \
                > canary/outputs/latest.json 2> canary/outputs/latest.error.log
              ;;
            selection|qa)
              node src/run-one.js --production --decision .factory-wake/decision.json --json \
                > canary/outputs/latest.json 2> canary/outputs/latest.error.log
              ;;
            checkpoint)
              printf '{"nextAction":{"code":"checkpoint-hardened","owner":"architect"}}\n' \
                > canary/outputs/latest.json
              : > canary/outputs/latest.error.log
              ;;
            *)
              echo "Unsupported Architect wake mode: $MODE" > canary/outputs/latest.error.log
              false
              ;;
          esac
          exit_code=$?
          set -e
          node -e "JSON.parse(require('node:fs').readFileSync('canary/outputs/latest.json', 'utf8'))" 2>/dev/null || true
          printf '%s\n' "$MODE" > canary/outputs/mode.txt
          printf '%s\n' "$WAKE_ID" > canary/outputs/wake-id.txt
          printf '%s\n' "$exit_code" > canary/outputs/exit-code.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Scan checkpoint and write integrity manifest
        id: scan
        if: always()
        shell: bash
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODE: ${{ steps.control.outputs.mode }}
          WAKE_ID: ${{ steps.control.outputs.wake_id }}
          RESTORE_RUN_ID: ${{ steps.control.outputs.restore_run_id }}
        run: |
          mkdir -p canary/outputs
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync('canary/outputs/checkpoint.json', `${JSON.stringify({
            schemaVersion: 'factory-checkpoint-v1',
            runId: process.env.GITHUB_RUN_ID,
            sourceSha: process.env.GITHUB_SHA,
            mode: process.env.MODE,
            wakeId: process.env.WAKE_ID,
            restoredFromRunId: process.env.RESTORE_RUN_ID || null,
          }, null, 2)}\n`);
          const roots = ['state', 'canary/outputs'];
          const files = [];
          const visit = (entry) => {
            if (!fs.existsSync(entry)) return;
            const stat = fs.statSync(entry);
            if (stat.isDirectory()) for (const name of fs.readdirSync(entry)) visit(path.join(entry, name));
            else files.push(entry);
          };
          roots.forEach(visit);
          const secrets = [process.env.APIFY_API_TOKEN, process.env.CURSOR_API_KEY].filter(Boolean);
          for (const file of files) {
            const contents = fs.readFileSync(file);
            for (const secret of secrets) {
              if (contents.includes(Buffer.from(secret))) throw new Error(`Secret material detected in checkpoint file: ${file}`);
            }
          }
          NODE
          find state canary/outputs -type f ! -name manifest.sha256 -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum > canary/outputs/manifest.sha256

      - name: Upload resumable checkpoint and Architect review surface
        id: upload
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-checkpoint-${{ github.run_id }}
          path: |
            state
            canary/outputs/latest.json
            canary/outputs/latest.error.log
            canary/outputs/mode.txt
            canary/outputs/wake-id.txt
            canary/outputs/exit-code.txt
            canary/outputs/checkpoint.json
            canary/outputs/manifest.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed status
        if: always() && (steps.factory.outputs.exit_code != '0' || steps.scan.outcome != 'success' || steps.upload.outcome != 'success')
        run: exit 1
