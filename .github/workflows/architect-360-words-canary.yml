name: Architect 360 Words canary

on:
  push:
    branches:
      - architect/360-words-canary-verified
    paths:
      - .factory-wake/360-words-control.json

permissions:
  contents: read
  actions: read

concurrency:
  group: 360-words-canary-verified-capacity-one
  cancel-in-progress: false

jobs:
  writer1:
    # Repository-owner authorship plus the control-file requestedBy check is
    # the only wake authority. The dormant file exits before any secret/vendor
    # step and never creates a Cursor job.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact canary branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate Architect control file and changed-path boundary
        id: control
        shell: bash
        env:
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          VERIFIED_LANE: 'true'
        run: |
          node scripts/360-words-control.mjs

      - name: Set up Node for active wake
        if: steps.control.outputs.dormant != 'true'
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: '24'

      - name: Select verified Writer1 dispatch mode
        id: dispatch_mode
        if: steps.control.outputs.dormant != 'true'
        shell: bash
        run: |
          dispatch_mode="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { selectVerifiedWriter1Dispatch } from './scripts/360-words-control.mjs';
          process.stdout.write(selectVerifiedWriter1Dispatch(JSON.parse(fs.readFileSync('.factory-wake/360-words-control.json', 'utf8'))));
          NODE
          )"
          if [ "$dispatch_mode" = 'unsupported-verified-lane' ]; then
            echo "Unsupported verified-lane Writer1 dispatch: $dispatch_mode" >&2
            exit 1
          fi
          echo "mode=$dispatch_mode" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        if: steps.control.outputs.dormant != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate sealed 360 handoff, pin, and four-route topology
        id: sealed
        shell: bash
        run: |
          mkdir -p canary/runtime canary/outputs
          if [ "${{ steps.control.outputs.dormant }}" = "true" ]; then
            node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('canary/runtime/dormant.json', JSON.stringify({status:'dormant',stage:'writer1'}, null, 2)+'\\n')"
          else
            node --import tsx scripts/360-words-canary.ts --validate-only
          fi

      - name: Download and verify immutable GitHub Writer1 baseline before vendor access
        if: steps.control.outputs.dormant != 'true' && (steps.control.outputs.recovery_version == 'words-writer1-correction/v2' || steps.control.outputs.recovery_version == 'words-writer1-post-dispatch-retrieval/v1' || steps.control.outputs.recovery_version == 'words-writer1-post-dispatch-seal/v1')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_REPOSITORY: ${{ steps.control.outputs.baseline_repository }}
          BASELINE_COMMIT: ${{ steps.control.outputs.baseline_commit }}
          BASELINE_PATH: ${{ steps.control.outputs.baseline_path }}
          BASELINE_BLOB_SHA: ${{ steps.control.outputs.baseline_blob_sha }}
          BASELINE_RAW_SHA256: ${{ steps.control.outputs.baseline_raw_sha256 }}
          BASELINE_SIZE: ${{ steps.control.outputs.baseline_size }}
          SEALED_HANDOFF_PATH: canary/sealed/360-four-page-reseal-handoff.json
          BASELINE_OUTPUT_ROOT: canary/inputs/github-writer1-baseline
        run: node scripts/360-words-github-baseline.mjs

      - name: Validate secret-backed Cursor runtime
        if: steps.control.outputs.dormant != 'true'
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          CURSOR_FAST: 'false'
        run: |
          test -n "$CURSOR_API_KEY"
          test "$CURSOR_MODEL" = "cursor-grok-4.6-high"
          test "$CURSOR_FAST" = "false"

      - name: Download and verify exact quarantined Writer1 correction-v3 source
        if: steps.control.outputs.dormant != 'true' && steps.control.outputs.recovery_version == 'words-writer1-correction/v3'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ACTION_RUN_ID: '32838242891'
          EXPECTED_ARTIFACT_ID: '9559472540'
          EXPECTED_ARTIFACT_ZIP_DIGEST: 'sha256:455c10d5928ee64d0d27d5f86eb80f63bd21dd811f601f6666f2c5b878eae824'
          EXPECTED_RAW_PATH: 'quarantine/writer1-rejected-output.txt'
          EXPECTED_RAW_DIGEST: 'sha256:1e2d5cabca16346f960b7bd893d2af1adf8dc6d453da926f7012711ae45ca0dd'
          EXPECTED_RAW_SIZE: '22468'
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$EXPECTED_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$EXPECTED_ACTION_RUN_ID"
          test "$(jq -r '.digest' <<<"$metadata")" = "$EXPECTED_ARTIFACT_ZIP_DIGEST"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run")" = "$EXPECTED_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$run")" = 'architect/360-words-canary-verified'
          mkdir -p canary/inputs/writer1-correction-v3-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}/zip" > canary/inputs/writer1-correction-v3.zip
          test "sha256:$(sha256sum canary/inputs/writer1-correction-v3.zip | cut -d ' ' -f 1)" = "$EXPECTED_ARTIFACT_ZIP_DIGEST"
          unzip -q canary/inputs/writer1-correction-v3.zip -d canary/inputs/writer1-correction-v3-artifact
          test "$(unzip -Z1 canary/inputs/writer1-correction-v3.zip | LC_ALL=C sort)" = "$EXPECTED_RAW_PATH"
          source_file="canary/inputs/writer1-correction-v3-artifact/$EXPECTED_RAW_PATH"
          test -f "$source_file"
          test "$(wc -c < "$source_file" | tr -d ' ')" = "$EXPECTED_RAW_SIZE"
          test "sha256:$(sha256sum "$source_file" | cut -d ' ' -f 1)" = "$EXPECTED_RAW_DIGEST"

      - name: Download and verify exact prior Writer1 dispatch artifact
        if: steps.control.outputs.dormant != 'true' && (steps.control.outputs.recovery_version == 'words-writer1-artifact-recovery/v2' || steps.control.outputs.recovery_version == 'words-writer1-artifact-recovery/v3')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ACTION_RUN_ID: '32785189225'
          EXPECTED_ARTIFACT_ID: '9541802267'
          EXPECTED_SOURCE_SHA: ${{ steps.control.outputs.source_sha }}
          EXPECTED_V1_RECOVERY_ACTION_RUN_ID: '32793130502'
          EXPECTED_V1_RECOVERY_ARTIFACT_ID: '9543869555'
          EXPECTED_V1_RECOVERY_SOURCE_SHA: '6cf9b42e43e5728614a9b7302a8791e527197e3d'
          EXPECTED_V1_RECOVERY_ARTIFACT_DIGEST: 'sha256:2d1d1c0d281917025be80898ab03c94171d59d1e2920ecf540b241f666464502'
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$EXPECTED_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$EXPECTED_ACTION_RUN_ID"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run")" = "$EXPECTED_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$run")" = 'architect/360-words-canary'
          test "$(jq -r '.head_sha' <<<"$run")" = "$EXPECTED_SOURCE_SHA"
          SEALED_HANDOFF_DIGEST="$(jq -r '.resealDigest' canary/sealed/360-four-page-reseal-handoff.json)"
          mkdir -p canary/inputs/prior-dispatch-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}/zip" > canary/inputs/prior-writer1-dispatch.zip
          unzip -q canary/inputs/prior-writer1-dispatch.zip -d canary/inputs/prior-dispatch-artifact
          test -f canary/inputs/prior-dispatch-artifact/runtime/dispatch-receipt.json
          cat > canary/inputs/prior-dispatch-artifact/runtime/source-verification.json <<JSON
          {"actionRunId":"$EXPECTED_ACTION_RUN_ID","artifactId":$EXPECTED_ARTIFACT_ID,"headBranch":"architect/360-words-canary","headSha":"$EXPECTED_SOURCE_SHA","sealedHandoffDigest":"$SEALED_HANDOFF_DIGEST"}
          JSON
          v1_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_V1_RECOVERY_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$v1_metadata")" = "$EXPECTED_V1_RECOVERY_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$v1_metadata")" = "$EXPECTED_V1_RECOVERY_ACTION_RUN_ID"
          test "$(jq -r '.digest' <<<"$v1_metadata")" = "$EXPECTED_V1_RECOVERY_ARTIFACT_DIGEST"
          v1_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_V1_RECOVERY_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$v1_run")" = "$EXPECTED_V1_RECOVERY_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$v1_run")" = 'architect/360-words-canary'
          test "$(jq -r '.head_sha' <<<"$v1_run")" = "$EXPECTED_V1_RECOVERY_SOURCE_SHA"
          mkdir -p canary/inputs/prior-v1-recovery-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_V1_RECOVERY_ARTIFACT_ID}/zip" > canary/inputs/prior-v1-recovery.zip
          test "$(sha256sum canary/inputs/prior-v1-recovery.zip | cut -d ' ' -f 1)" = "${EXPECTED_V1_RECOVERY_ARTIFACT_DIGEST#sha256:}"
          unzip -q canary/inputs/prior-v1-recovery.zip -d canary/inputs/prior-v1-recovery-artifact
          cat > canary/inputs/prior-v1-recovery-artifact/runtime/artifact-verification.json <<JSON
          {"actionRunId":"$EXPECTED_V1_RECOVERY_ACTION_RUN_ID","artifactId":$EXPECTED_V1_RECOVERY_ARTIFACT_ID,"headBranch":"architect/360-words-canary","headSha":"$EXPECTED_V1_RECOVERY_SOURCE_SHA","artifactDigest":"$EXPECTED_V1_RECOVERY_ARTIFACT_DIGEST"}
          JSON

      - name: Download exact failed post-dispatch Writer1 Action artifact
        if: steps.control.outputs.dormant != 'true' && (steps.control.outputs.recovery_version == 'words-writer1-post-dispatch-retrieval/v1' || steps.control.outputs.recovery_version == 'words-writer1-post-dispatch-seal/v1')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ACTION_RUN_ID: '32825265478'
          EXPECTED_ARTIFACT_ID: '9554789848'
          EXPECTED_ARTIFACT_ZIP_DIGEST: ${{ steps.control.outputs.receipt_manifest_artifact_zip_digest }}
          EXPECTED_ARTIFACT_ZIP_SIZE: ${{ steps.control.outputs.receipt_manifest_artifact_zip_size }}
          EXPECTED_RECEIPT_DIGEST: ${{ steps.control.outputs.receipt_manifest_receipt_digest }}
          EXPECTED_RECEIPT_SIZE: ${{ steps.control.outputs.receipt_manifest_receipt_size }}
          EXPECTED_RECEIPT_PATH: ${{ steps.control.outputs.receipt_manifest_receipt_path }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$EXPECTED_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$EXPECTED_ACTION_RUN_ID"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run")" = "$EXPECTED_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$run")" = 'architect/360-words-canary-verified'
          mkdir -p canary/inputs/post-dispatch-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}/zip" > canary/inputs/post-dispatch.zip
          unzip -q canary/inputs/post-dispatch.zip -d canary/inputs/post-dispatch-artifact
          test "sha256:$(sha256sum canary/inputs/post-dispatch.zip | cut -d ' ' -f 1)" = "$EXPECTED_ARTIFACT_ZIP_DIGEST"
          test "$(wc -c < canary/inputs/post-dispatch.zip | tr -d ' ')" = "$EXPECTED_ARTIFACT_ZIP_SIZE"
          if [ "$EXPECTED_RECEIPT_PATH" = 'runtime/writer1-dispatch-receipt.json' ]; then
            receipt='canary/inputs/post-dispatch-artifact/runtime/writer1-dispatch-receipt.json'
          elif [ "$EXPECTED_RECEIPT_PATH" = 'runtime/dispatch-receipt.json' ]; then
            receipt='canary/inputs/post-dispatch-artifact/runtime/dispatch-receipt.json'
          else
            echo 'sealed receipt path is not one of the approved exact logical paths' >&2
            exit 1
          fi
          test -f "$receipt"
          test "$(wc -c < "$receipt" | tr -d ' ')" = "$EXPECTED_RECEIPT_SIZE"
          test "sha256:$(sha256sum "$receipt" | cut -d ' ' -f 1)" = "$EXPECTED_RECEIPT_DIGEST"

      - name: Download exact sealed mode-A manifest for retrieval-only mode
        if: steps.control.outputs.dormant != 'true' && steps.control.outputs.recovery_version == 'words-writer1-post-dispatch-retrieval/v1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEAL_ACTION_RUN_ID: ${{ steps.control.outputs.seal_action_run_id }}
          SEAL_ARTIFACT_ID: ${{ steps.control.outputs.seal_artifact_id }}
          SEAL_SOURCE_SHA: ${{ steps.control.outputs.seal_source_sha }}
          SEAL_MANIFEST_BYTES_DIGEST: ${{ steps.control.outputs.seal_manifest_bytes_digest }}
          SEAL_MANIFEST_SIZE: ${{ steps.control.outputs.seal_manifest_size }}
        run: |
          set -euo pipefail
          test -n "$SEAL_ACTION_RUN_ID"; test -n "$SEAL_ARTIFACT_ID"; test -n "$SEAL_SOURCE_SHA"
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SEAL_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$SEAL_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$SEAL_ACTION_RUN_ID"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SEAL_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run")" = "$SEAL_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$run")" = 'architect/360-words-canary-verified'
          test "$(jq -r '.head_sha' <<<"$run")" = "$SEAL_SOURCE_SHA"
          mkdir -p canary/inputs/post-dispatch-seal-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SEAL_ARTIFACT_ID}/zip" > canary/inputs/post-dispatch-seal.zip
          unzip -q canary/inputs/post-dispatch-seal.zip -d canary/inputs/post-dispatch-seal-artifact
          expected_seal_listing="$(printf '%s\n' runtime/state.json runtime/writer1-dispatch-manifest.json runtime/writer1-seal-receipt.json | LC_ALL=C sort)"
          actual_seal_listing="$(unzip -Z1 canary/inputs/post-dispatch-seal.zip | LC_ALL=C sort)"
          test "$actual_seal_listing" = "$expected_seal_listing"
          manifest='canary/inputs/post-dispatch-seal-artifact/runtime/writer1-dispatch-manifest.json'
          seal_receipt='canary/inputs/post-dispatch-seal-artifact/runtime/writer1-seal-receipt.json'
          test -f "$manifest"
          test -f "$seal_receipt"
          test "$(wc -c < "$manifest" | tr -d ' ')" = "$SEAL_MANIFEST_SIZE"
          test "sha256:$(sha256sum "$manifest" | cut -d ' ' -f 1)" = "$SEAL_MANIFEST_BYTES_DIGEST"

      - name: Download and verify exact failed v2 metadata-recovery artifact
        if: steps.control.outputs.dormant != 'true' && steps.control.outputs.recovery_version == 'words-writer1-artifact-recovery/v3'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_V2_RECOVERY_ACTION_RUN_ID: '32795481394'
          EXPECTED_V2_RECOVERY_ARTIFACT_ID: '9544693335'
          EXPECTED_V2_RECOVERY_SOURCE_SHA: '29311637f3f4adc04f3dd9ca7bfc54f05df47c88'
          EXPECTED_V2_RECOVERY_ARTIFACT_DIGEST: 'sha256:469f3b04eb502316404d98023df34c38e57e8cc6bf51d6dbfdbda12be3834e2f'
        run: |
          set -euo pipefail
          v2_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_V2_RECOVERY_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$v2_metadata")" = "$EXPECTED_V2_RECOVERY_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$v2_metadata")" = "$EXPECTED_V2_RECOVERY_ACTION_RUN_ID"
          test "$(jq -r '.digest' <<<"$v2_metadata")" = "$EXPECTED_V2_RECOVERY_ARTIFACT_DIGEST"
          v2_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_V2_RECOVERY_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$v2_run")" = "$EXPECTED_V2_RECOVERY_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$v2_run")" = 'architect/360-words-canary'
          test "$(jq -r '.head_sha' <<<"$v2_run")" = "$EXPECTED_V2_RECOVERY_SOURCE_SHA"
          mkdir -p canary/inputs/prior-v2-recovery-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_V2_RECOVERY_ARTIFACT_ID}/zip" > canary/inputs/prior-v2-recovery.zip
          test "$(sha256sum canary/inputs/prior-v2-recovery.zip | cut -d ' ' -f 1)" = "${EXPECTED_V2_RECOVERY_ARTIFACT_DIGEST#sha256:}"
          unzip -q canary/inputs/prior-v2-recovery.zip -d canary/inputs/prior-v2-recovery-artifact
          cat > canary/inputs/prior-v2-recovery-artifact/runtime/artifact-verification.json <<JSON
          {"actionRunId":"$EXPECTED_V2_RECOVERY_ACTION_RUN_ID","artifactId":$EXPECTED_V2_RECOVERY_ARTIFACT_ID,"headBranch":"architect/360-words-canary","headSha":"$EXPECTED_V2_RECOVERY_SOURCE_SHA","artifactDigest":"$EXPECTED_V2_RECOVERY_ARTIFACT_DIGEST"}
          JSON

      - name: Download and verify exact failed v3 validation artifact
        if: steps.control.outputs.dormant != 'true' && steps.control.outputs.recovery_version == 'words-writer1-artifact-recovery/v3-finalize'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_V3_FINALIZE_ACTION_RUN_ID: '32797811881'
          EXPECTED_V3_FINALIZE_ARTIFACT_ID: '9545486318'
          EXPECTED_V3_FINALIZE_SOURCE_SHA: '6d5f9e0f65af98185b6827b445cbfeff74e88ce7'
          EXPECTED_V3_FINALIZE_ARTIFACT_DIGEST: 'sha256:23eac7a38caf588f383e424bd7bf39e5246f5634c7c06866d8e94250e6fe710e'
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_V3_FINALIZE_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$EXPECTED_V3_FINALIZE_ARTIFACT_ID"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$EXPECTED_V3_FINALIZE_ACTION_RUN_ID"
          test "$(jq -r '.digest' <<<"$metadata")" = "$EXPECTED_V3_FINALIZE_ARTIFACT_DIGEST"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_V3_FINALIZE_ACTION_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run")" = "$EXPECTED_V3_FINALIZE_ACTION_RUN_ID"
          test "$(jq -r '.head_branch' <<<"$run")" = 'architect/360-words-canary'
          test "$(jq -r '.head_sha' <<<"$run")" = "$EXPECTED_V3_FINALIZE_SOURCE_SHA"
          mkdir -p canary/inputs/latest-v3-finalize-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_V3_FINALIZE_ARTIFACT_ID}/zip" > canary/inputs/latest-v3-finalize.zip
          test "$(sha256sum canary/inputs/latest-v3-finalize.zip | cut -d ' ' -f 1)" = "${EXPECTED_V3_FINALIZE_ARTIFACT_DIGEST#sha256:}"
          unzip -q canary/inputs/latest-v3-finalize.zip -d canary/inputs/latest-v3-finalize-artifact
          cat > canary/inputs/latest-v3-finalize-artifact/runtime/artifact-verification.json <<JSON
          {"actionRunId":"$EXPECTED_V3_FINALIZE_ACTION_RUN_ID","artifactId":$EXPECTED_V3_FINALIZE_ARTIFACT_ID,"headBranch":"architect/360-words-canary","headSha":"$EXPECTED_V3_FINALIZE_SOURCE_SHA","artifactDigest":"$EXPECTED_V3_FINALIZE_ARTIFACT_DIGEST"}
          JSON

      - name: Run bounded Writer1 path and stop at Architect QA
        id: dispatch
        if: steps.control.outputs.dormant != 'true'
        continue-on-error: true
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          CURSOR_FAST: 'false'
          WRITER1_PRIOR_DISPATCH_ROOT: canary/inputs/prior-dispatch-artifact
          WRITER1_PRIOR_RECOVERY_ROOT: canary/inputs/prior-v1-recovery-artifact
          WRITER1_PRIOR_RECOVERY_V2_ROOT: canary/inputs/prior-v2-recovery-artifact
          WRITER1_LATEST_V3_FINALIZE_ROOT: canary/inputs/latest-v3-finalize-artifact
          WRITER1_GITHUB_BASELINE_ROOT: canary/inputs/github-writer1-baseline
          WRITER1_POST_DISPATCH_ROOT: canary/inputs/post-dispatch-artifact
          WRITER1_POST_DISPATCH_ZIP: canary/inputs/post-dispatch.zip
          WRITER1_POST_DISPATCH_SEAL_ROOT: canary/inputs/post-dispatch-seal-artifact
          WRITER1_CORRECTION_V3_SOURCE_ROOT: canary/inputs/writer1-correction-v3-artifact
        run: |
          if [ "${{ steps.dispatch_mode.outputs.mode }}" = 'verified-writer1-seal-only' ]; then
            node --import tsx scripts/360-words-verified.ts --writer1-seal-only
          elif [ "${{ steps.dispatch_mode.outputs.mode }}" = 'verified-writer1-correction-v2' ]; then
            node --import tsx scripts/360-words-verified.ts --writer1-correction-v2
          elif [ "${{ steps.dispatch_mode.outputs.mode }}" = 'verified-writer1-correction-v3' ]; then
            node --import tsx scripts/360-words-verified.ts --writer1-correction-v3
          elif [ "${{ steps.dispatch_mode.outputs.mode }}" = 'verified-writer1-retrieval-only' ]; then
            node --import tsx scripts/360-words-verified.ts --writer1-retrieval-only
          elif [ "${{ steps.dispatch_mode.outputs.mode }}" = 'verified-writer1-correction-v1' ]; then
            node --import tsx scripts/360-words-verified.ts --writer1-correction
          else
            echo "Unsupported verified-lane Writer1 dispatch" >&2
            exit 1
          fi

      - name: Write durable failure/state surface
        if: always()
        shell: bash
        run: |
          mkdir -p canary/runtime canary/outputs
          test -f canary/runtime/state.json || node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('canary/runtime/state.json', JSON.stringify({status:'workflow-failed-before-writer1',stage:'writer1',runId:'32717620900'}, null, 2)+'\\n')"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const files = [];
          const visit = (root) => { if (!fs.existsSync(root)) return; const stat = fs.statSync(root); if (stat.isDirectory()) for (const name of fs.readdirSync(root)) visit(`${root}/${name}`); else files.push(root); };
          visit('canary/runtime'); visit('canary/outputs');
          const manifest = files.sort().map((file) => `${crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}  ${file}`).join('\n') + '\n';
          fs.writeFileSync('canary/runtime/manifest.sha256', manifest);
          NODE

      - name: Verify active artifacts contain no secret material
        id: secret_scan
        if: always() && steps.control.outputs.dormant != 'true'
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [];
          const visit = (root) => { if (!fs.existsSync(root)) return; const stat = fs.statSync(root); if (stat.isDirectory()) for (const name of fs.readdirSync(root)) visit(`${root}/${name}`); else files.push(root); };
          visit('canary/runtime'); visit('canary/outputs'); visit('canary/quarantine');
          if (process.env.CURSOR_API_KEY && files.some((file) => fs.readFileSync(file).includes(Buffer.from(process.env.CURSOR_API_KEY)))) throw new Error('secret material detected in canary artifacts');
          NODE

      - name: Upload durable canary state, dispatch receipt, and output
        if: always() && (steps.control.outputs.dormant == 'true' || steps.secret_scan.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 360-words-verified-writer1-${{ github.run_id }}
          path: |
            canary/runtime/cursor-receipts.json
            canary/runtime/dormant.json
            canary/runtime/writer1-*.json
            canary/runtime/verified-writer2-*.json
            canary/runtime/verified-writer3-*.json
            canary/runtime/verified-*.json
            canary/runtime/failure.json
            canary/runtime/state.json
            canary/quarantine/writer1-rejected-output.txt
            canary/quarantine/writer1-rejection.json
            canary/outputs/writer1-output.json
            canary/outputs/verified-writer2.json
            canary/outputs/verified-writer3.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed result
        if: always() && steps.control.outputs.dormant != 'true' && steps.dispatch.outcome != 'success'
        run: exit 1
