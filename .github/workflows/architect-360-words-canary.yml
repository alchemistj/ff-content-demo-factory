name: Architect 360 Words canary

on:
  push:
    branches:
      - architect/360-words-canary
    paths:
      - .factory-wake/360-words-control.json

permissions:
  contents: read
  actions: read

concurrency:
  group: 360-words-canary-32717620900-writer1
  cancel-in-progress: false

jobs:
  writer1:
    # Repository-owner authorship plus the control-file requestedBy check is
    # the only wake authority. The dormant file exits before any secret/vendor
    # step and never creates a Cursor job.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact canary branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate Architect control file and changed-path boundary
        id: control
        shell: bash
        run: |
          node scripts/360-words-control.mjs

      - name: Set up Node for active wake
        if: steps.control.outputs.dormant != 'true'
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: '24'

      - name: Install locked dependencies
        if: steps.control.outputs.dormant != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate sealed 360 handoff, pin, and four-route topology
        id: sealed
        shell: bash
        run: |
          mkdir -p canary/runtime canary/outputs
          if [ "${{ steps.control.outputs.dormant }}" = "true" ]; then
            node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('canary/runtime/dormant.json', JSON.stringify({status:'dormant',stage:'writer1'}, null, 2)+'\\n')"
          else
            node --import tsx scripts/360-words-canary.ts --validate-only
          fi

      - name: Download and verify exact prior Writer1 artifact
        if: steps.control.outputs.dormant != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ACTION_RUN_ID: '32776170549'
          EXPECTED_ARTIFACT_ID: '9539302493'
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"$metadata")" = "$EXPECTED_ARTIFACT_ID"
          test "$(jq -r 'getpath(["workflow_" + "run", "id"])' <<<"$metadata")" = "$EXPECTED_ACTION_RUN_ID"
          mkdir -p canary/inputs/prior-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}/zip" > canary/inputs/prior-writer1.zip
          unzip -q canary/inputs/prior-writer1.zip -d canary/inputs/prior-artifact
          test -f canary/inputs/prior-artifact/runtime/writer1-receipt.json
          test -f canary/inputs/prior-artifact/runtime/dispatch-receipt.json
          test -f canary/inputs/prior-artifact/runtime/manifest.sha256
          test -f canary/inputs/prior-artifact/outputs/writer1-output.json

      - name: Validate secret-backed Cursor runtime
        if: steps.control.outputs.dormant != 'true'
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          CURSOR_FAST: 'false'
        run: |
          test -n "$CURSOR_API_KEY"
          test "$CURSOR_MODEL" = "cursor-grok-4.6-high"
          test "$CURSOR_FAST" = "false"

      - name: Retrieve Writer1 JSON in the same Cursor thread and stop at Architect QA
        id: dispatch
        if: steps.control.outputs.dormant != 'true'
        continue-on-error: true
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          CURSOR_FAST: 'false'
          WRITER1_PRIOR_ARTIFACT_ROOT: canary/inputs/prior-artifact
        run: node --import tsx scripts/360-words-canary.ts --correction

      - name: Write durable failure/state surface
        if: always()
        shell: bash
        run: |
          mkdir -p canary/runtime canary/outputs
          test -f canary/runtime/state.json || node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('canary/runtime/state.json', JSON.stringify({status:'workflow-failed-before-writer1',stage:'writer1',runId:'32717620900'}, null, 2)+'\\n')"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const files = [];
          const visit = (root) => { if (!fs.existsSync(root)) return; const stat = fs.statSync(root); if (stat.isDirectory()) for (const name of fs.readdirSync(root)) visit(`${root}/${name}`); else files.push(root); };
          visit('canary/runtime'); visit('canary/outputs');
          const manifest = files.sort().map((file) => `${crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}  ${file}`).join('\n') + '\n';
          fs.writeFileSync('canary/runtime/manifest.sha256', manifest);
          NODE

      - name: Verify active artifacts contain no secret material
        if: always() && steps.control.outputs.dormant != 'true'
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [];
          const visit = (root) => { if (!fs.existsSync(root)) return; const stat = fs.statSync(root); if (stat.isDirectory()) for (const name of fs.readdirSync(root)) visit(`${root}/${name}`); else files.push(root); };
          visit('canary/runtime'); visit('canary/outputs');
          if (process.env.CURSOR_API_KEY && files.some((file) => fs.readFileSync(file).includes(Buffer.from(process.env.CURSOR_API_KEY)))) throw new Error('secret material detected in canary artifacts');
          NODE

      - name: Upload durable canary state, dispatch receipt, and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 360-words-writer1-${{ github.run_id }}
          path: |
            canary/runtime
            canary/outputs
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed result
        if: always() && steps.control.outputs.dormant != 'true' && steps.dispatch.outcome != 'success'
        run: exit 1
