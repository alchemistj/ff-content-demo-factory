# Search Google Maps for prospects and commit them to the scout-data branch.
# Inputs are passed through env. The Apify token is set only on the scout step.

name: Prospect scout

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search text, for example window installation
        required: true
        type: string
      location:
        description: Location, for example Indianapolis, IN
        required: true
        type: string
      max_places:
        description: Maximum places, from 1 to 120
        required: false
        default: "60"
        type: string
      slug:
        description: Output folder slug (optional)
        required: false
        type: string
  push:
    paths:
      - "scout-requests/*.json"

permissions:
  contents: write

concurrency:
  group: scout-data
  cancel-in-progress: false

env:
  SCOUT_QUERY: ${{ inputs.query }}
  SCOUT_LOCATION: ${{ inputs.location }}
  MAX_PLACES: ${{ inputs.max_places }}
  SCOUT_SLUG: ${{ inputs.slug }}
  SCOUT_TRIGGER: ${{ github.event_name }}
  EVENT_BEFORE: ${{ github.event.before }}

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Set work folder
        run: echo "SCOUT_WORK=${RUNNER_TEMP}/scout-data" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Require one request file
        if: github.event_name == 'push'
        id: request
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ -z "${EVENT_BEFORE}" ] || [ "$EVENT_BEFORE" = "$zero" ]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r --diff-filter=AM "$GITHUB_SHA" -- 'scout-requests/*.json')
          else
            mapfile -t changed < <(git diff --name-only --diff-filter=AM "$EVENT_BEFORE" "$GITHUB_SHA" -- 'scout-requests/*.json')
          fi
          if [ "${#changed[@]}" -ne 1 ]; then
            echo "This push must change exactly one scout-requests/*.json file. Found ${#changed[@]}: ${changed[*]:-none}."
            exit 1
          fi
          file="${changed[0]}"
          if ! [[ "$file" =~ ^scout-requests/[A-Za-z0-9._-]{1,80}\.json$ ]]; then
            echo "Request file must be a single scout-requests/*.json file. Got: ${file}"
            exit 1
          fi
          if [ ! -f "$file" ]; then
            echo "Request file ${file} is not in this commit."
            exit 1
          fi
          echo "request_file=${file}" >> "$GITHUB_OUTPUT"

      - name: Prepare scout-data
        run: |
          set -euo pipefail
          git worktree remove --force "$SCOUT_WORK" >/dev/null 2>&1 || true
          rm -rf "$SCOUT_WORK"
          if git ls-remote --exit-code --heads origin scout-data >/dev/null 2>&1; then
            git fetch origin scout-data
            git worktree add "$SCOUT_WORK" origin/scout-data
            git -C "$SCOUT_WORK" checkout -B scout-data
          else
            git worktree add --detach "$SCOUT_WORK" HEAD
            git -C "$SCOUT_WORK" checkout --orphan scout-data
            git -C "$SCOUT_WORK" rm -rf --cached . >/dev/null
            find "$SCOUT_WORK" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Scout places
        id: scout
        continue-on-error: true
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        run: |
          set -euo pipefail
          args=(--out "$SCOUT_WORK/scout" --trigger "$SCOUT_TRIGGER")
          if [ "$SCOUT_TRIGGER" = "push" ]; then
            args+=(--request "$GITHUB_WORKSPACE/$REQUEST_FILE")
          elif [ "$SCOUT_TRIGGER" = "workflow_dispatch" ]; then
            args+=(--query "$SCOUT_QUERY" --location "$SCOUT_LOCATION")
            if [ -n "${SCOUT_SLUG}" ]; then args+=(--slug "$SCOUT_SLUG"); fi
            if [ -n "${MAX_PLACES}" ]; then args+=(--max-places "$MAX_PLACES"); fi
          else
            echo "Unsupported trigger: $SCOUT_TRIGGER"
            exit 1
          fi
          receipt_out="${RUNNER_TEMP}/prospect-scout-receipt.json"
          set +e
          npm run --silent prospects:scout -- "${args[@]}" | tee "$receipt_out"
          statuses=("${PIPESTATUS[@]}")
          scout_exit=${statuses[0]}
          tee_exit=${statuses[1]:-0}
          set -e
          if [ "$tee_exit" -ne 0 ]; then
            echo "Could not save the prospect scout receipt"
            exit 1
          fi
          slug=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const receipt = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (typeof receipt.slug !== "string" || !/^[a-z0-9-]{2,60}$/.test(receipt.slug)) {
              process.stderr.write("Prospect scout did not return a safe slug\n");
              process.exit(1);
            }
            process.stdout.write(receipt.slug);
          ' "$receipt_out")
          {
            echo "slug=${slug}"
            echo "exit_code=${scout_exit}"
            echo "dir=${SCOUT_WORK}/scout/${slug}"
            echo "receipt=${SCOUT_WORK}/scout/${slug}/receipt.json"
            echo "places=${SCOUT_WORK}/scout/${slug}/places.json"
            echo "files_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/scout-data/scout/${slug}/receipt.json"
          } >> "$GITHUB_OUTPUT"
          exit "$scout_exit"

      - name: Write job summary
        if: steps.scout.outputs.receipt != ''
        env:
          RECEIPT_PATH: ${{ steps.scout.outputs.receipt }}
          FILES_URL: ${{ steps.scout.outputs.files_url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(process.env.RECEIPT_PATH, "utf8"));
          const request = receipt.request ?? {};
          const counts = receipt.counts ?? {};
          const lines = [
            "### Prospect scout",
            "",
            `- Query: ${request.query ?? ""}`,
            `- Location: ${request.location ?? ""}`,
            `- Places: ${counts.returned ?? 0}`,
            `- Advertisements: ${counts.advertisements ?? 0}`,
            `- Status: ${receipt.status}`,
            `- Files: ${process.env.FILES_URL}`,
          ];
          if (receipt.detail) lines.push(`- Detail: ${receipt.detail}`);
          if (receipt.githubRunUrl) lines.push(`- Run: ${receipt.githubRunUrl}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          JS

      - name: Upload places
        if: steps.scout.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: prospect-scout-${{ steps.scout.outputs.slug }}
          path: ${{ steps.scout.outputs.dir }}
          if-no-files-found: error

      - name: Commit and push scout-data
        env:
          SCOUT_RESULT_SLUG: ${{ steps.scout.outputs.slug }}
        run: |
          set -euo pipefail
          git -C "$SCOUT_WORK" add -f scout
          if git -C "$SCOUT_WORK" diff --cached --quiet; then
            echo "No scout-data changes to commit"
            exit 0
          fi
          message="Scout Google Maps prospects"
          if [ -n "${SCOUT_RESULT_SLUG}" ]; then
            message="Scout Google Maps prospects for ${SCOUT_RESULT_SLUG}"
          fi
          git -C "$SCOUT_WORK" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "$message"
          pushed=0
          for try in 1 2 3; do
            if git -C "$SCOUT_WORK" push origin HEAD:scout-data; then
              pushed=1
              break
            fi
            if [ "$try" -eq 3 ]; then
              break
            fi
            git -C "$SCOUT_WORK" fetch origin scout-data
            git -C "$SCOUT_WORK" rebase origin/scout-data
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Push to scout-data failed after 3 tries"
            exit 1
          fi

      - name: Report scout failure
        if: steps.scout.outcome == 'failure'
        env:
          SCOUT_EXIT: ${{ steps.scout.outputs.exit_code }}
        run: |
          set -euo pipefail
          echo "Prospect scout failed with status ${SCOUT_EXIT}"
          exit 1
