name: Fresh current-head Gate 1 canary

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Exact commit SHA to prove and execute'
        required: true
        type: string
      request_file:
        description: 'Repository-relative fresh discovery request JSON'
        required: true
        type: string
      selection_file:
        description: 'Repository-relative Architect finalist-selection JSON'
        required: true
        type: string
      qa_file:
        description: 'Repository-relative Architect Gate 1 QA JSON'
        required: true
        type: string
      cursor_bundle_file:
        description: 'Repository-relative trusted GitHub-to-Cursor Cloud Agent result bundle JSON'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  current-head-gate1:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout requested exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert requested head and safe inputs
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUEST_FILE: ${{ inputs.request_file }}
          SELECTION_FILE: ${{ inputs.selection_file }}
          QA_FILE: ${{ inputs.qa_file }}
          CURSOR_BUNDLE_FILE: ${{ inputs.cursor_bundle_file }}
        run: |
          test "$EXPECTED_HEAD_SHA" = "$(git rev-parse HEAD)"
          printf '%s\n' "$EXPECTED_HEAD_SHA" | grep -Eq '^[a-f0-9]{40}$'
          echo "FACTORY_ASSERTED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for file in "$REQUEST_FILE" "$SELECTION_FILE" "$QA_FILE" "$CURSOR_BUNDLE_FILE"; do
            printf '%s\n' "$file" | grep -Eq '^[-a-zA-Z0-9_/.]+\.json$'
            case "$file" in *..*) echo "path traversal is not allowed" >&2; exit 1 ;; esac
            test -f "$file"
          done
          mkdir -p canary/outputs
          printf '{"schemaVersion":"factory-exact-head-proof-v1","expectedHeadSha":"%s","checkedOutSha":"%s","headAssertion":true,"workflowRunUrl":"%s/%s/actions/runs/%s"}\n' \
            "$EXPECTED_HEAD_SHA" "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > canary/outputs/exact-head-proof.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Validate trusted production runtime
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          test -n "$APIFY_API_TOKEN"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fresh current-head Gate 1 canary
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          REQUEST_FILE: ${{ inputs.request_file }}
          SELECTION_FILE: ${{ inputs.selection_file }}
          QA_FILE: ${{ inputs.qa_file }}
          CURSOR_BUNDLE_FILE: ${{ inputs.cursor_bundle_file }}
          FACTORY_ASSERTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: node src/run-gate1-canary.js canary "$REQUEST_FILE" "$SELECTION_FILE" "$QA_FILE" "$CURSOR_BUNDLE_FILE"
      - name: Upload Gate 1 canary proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-head-gate1-canary-${{ github.run_id }}
          path: |
            canary/outputs/exact-head-proof.json
            canary/outputs/current-head-gate1-proof.json
            canary/outputs/gate1.md
            canary/state/factory-state.json
          if-no-files-found: error
          retention-days: 30
