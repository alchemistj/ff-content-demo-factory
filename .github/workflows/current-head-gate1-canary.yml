name: Fresh current-head Gate 1 canary

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Exact commit SHA to prove and execute'
        required: true
        type: string
      issue_number:
        description: 'Authoritative Content Demo Factory Issue number'
        required: true
        type: string
      pr_number:
        description: 'Existing same-lineage PR number'
        required: true
        type: string
      branch:
        description: 'Existing same-lineage implementation branch'
        required: true
        type: string
      request_file:
        description: 'Repository-relative fresh discovery request JSON'
        required: true
        type: string
      selection_file:
        description: 'Repository-relative Architect finalist-selection JSON'
        required: true
        type: string
      qa_file:
        description: 'Repository-relative Architect Gate 1 QA JSON'
        required: true
        type: string
      cursor_bundle_file:
        description: 'Repository-relative trusted GitHub-to-Cursor Cloud Agent result bundle JSON'
        required: false
        type: string
      phase:
        description: 'Two-phase continuation: dispatch seals inputs; resume ingests the verified receipt bundle; integrated is sealed-evidence or already-bound local continuation'
        required: true
        default: resume
        type: choice
        options: [dispatch, resume, integrated]
      sealed_evidence:
        description: Replay sealed repository 360 evidence without paid Apify or Cursor workers
        required: false
        type: boolean
        default: false
      phase_a_run_id:
        description: Exact phase-A workflow run id whose pending artifact must be downloaded and verified
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  current-head-gate1:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout requested exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert requested head and safe inputs
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUEST_FILE: ${{ inputs.request_file }}
          SELECTION_FILE: ${{ inputs.selection_file }}
          QA_FILE: ${{ inputs.qa_file }}
          CURSOR_BUNDLE_FILE: ${{ inputs.cursor_bundle_file }}
          FACTORY_CANARY_PHASE: ${{ inputs.phase }}
          FACTORY_SEALED_EVIDENCE: ${{ inputs.sealed_evidence }}
          FACTORY_REPOSITORY: ${{ github.repository }}
        run: |
          test "$EXPECTED_HEAD_SHA" = "$(git rev-parse HEAD)"
          printf '%s\n' "$EXPECTED_HEAD_SHA" | grep -Eq '^[a-f0-9]{40}$'
          actual="$(git rev-parse HEAD)"
          echo "FACTORY_CHECKED_OUT_SHA=$actual" >> "$GITHUB_ENV"
          echo "FACTORY_ASSERTED_HEAD_SHA=$actual" >> "$GITHUB_ENV"
          echo "FACTORY_EXPECTED_HEAD_SHA=$EXPECTED_HEAD_SHA" >> "$GITHUB_ENV"
          echo "FACTORY_HEAD_ASSERTION=true" >> "$GITHUB_ENV"
          echo "FACTORY_TEST_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "FACTORY_ACTION_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "FACTORY_TEST_RESULT=asserted-checkout" >> "$GITHUB_ENV"
          for file in "$REQUEST_FILE" "$SELECTION_FILE" "$QA_FILE"; do
            printf '%s\n' "$file" | grep -Eq '^[-a-zA-Z0-9_/.]+\.json$'
            case "$file" in *..*) echo "path traversal is not allowed" >&2; exit 1 ;; esac
            test -f "$file"
          done
          if [ "${{ inputs.phase }}" = "resume" ] || [ "${{ inputs.phase }}" = "integrated" ]; then
            if [ "${{ inputs.sealed_evidence }}" != "true" ]; then
              test -n "$CURSOR_BUNDLE_FILE"
              printf '%s\n' "$CURSOR_BUNDLE_FILE" | grep -Eq '^[-a-zA-Z0-9_/.]+\.json$'
              case "$CURSOR_BUNDLE_FILE" in *..*) echo "path traversal is not allowed" >&2; exit 1 ;; esac
              test -f "$CURSOR_BUNDLE_FILE"
            fi
          fi
          mkdir -p canary/outputs
          printf '{"schemaVersion":"factory-exact-head-proof-v1","expectedHeadSha":"%s","checkedOutSha":"%s","headAssertion":true,"workflowRunUrl":"%s/%s/actions/runs/%s"}\n' \
            "$EXPECTED_HEAD_SHA" "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > canary/outputs/exact-head-proof.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Independently verify authoritative PR and Issue head before paid work
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,headRefName,headRefOid,body)"
          test "$(printf '%s' "$pr_json" | jq -r .number)" = "$PR_NUMBER"
          test "$(printf '%s' "$pr_json" | jq -r .headRefName)" = "$BRANCH"
          test "$(printf '%s' "$pr_json" | jq -r .headRefOid)" = "$EXPECTED_HEAD_SHA"
          printf '%s' "$pr_json" | jq -r .body | grep -Fq "issues/$ISSUE_NUMBER"
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number --jq .number | grep -Fxq "$ISSUE_NUMBER"
          echo "FACTORY_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - name: Validate trusted production runtime
        if: (inputs.phase == 'resume' || inputs.phase == 'integrated') && inputs.sealed_evidence != true
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          test -n "$APIFY_API_TOKEN"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fresh current-head Gate 1 canary
        env:
          APIFY_API_TOKEN: ${{ inputs.sealed_evidence == true && '' || secrets.APIFY_API_TOKEN }}
          REQUEST_FILE: ${{ inputs.request_file }}
          SELECTION_FILE: ${{ inputs.selection_file }}
          QA_FILE: ${{ inputs.qa_file }}
          CURSOR_BUNDLE_FILE: ${{ inputs.cursor_bundle_file }}
          FACTORY_ISSUE_NUMBER: ${{ inputs.issue_number }}
          FACTORY_PR_NUMBER: ${{ inputs.pr_number }}
          FACTORY_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          FACTORY_CANARY_PHASE: ${{ inputs.phase }}
          FACTORY_SEALED_EVIDENCE: ${{ inputs.sealed_evidence }}
          FACTORY_PHASE_A_RUN_ID: ${{ inputs.phase_a_run_id }}
          FACTORY_REPOSITORY: ${{ github.repository }}
        run: node src/run-gate1-canary.js . "$REQUEST_FILE" "$SELECTION_FILE" "$QA_FILE" "$CURSOR_BUNDLE_FILE"
      - name: Upload exact-head proof (required)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-head-gate1-canary-${{ github.run_id }}-exact-head
          path: canary/outputs/exact-head-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload phase-A handoff (required for dispatch)
        if: always() && inputs.phase == 'dispatch' && inputs.sealed_evidence != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-head-gate1-canary-${{ github.run_id }}
          path: canary/outputs/current-head-gate1-pending.json
          if-no-files-found: error
          retention-days: 30
      - name: Prove Gate 1 artifacts exist
        if: inputs.phase == 'resume' || inputs.phase == 'integrated'
        run: |
          test -s canary/outputs/current-head-gate1-proof.json
          test -s canary/outputs/gate1.md
      - name: Upload phase-B Gate 1 proof (required for resume or integrated)
        if: always() && (inputs.phase == 'resume' || inputs.phase == 'integrated')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-head-gate1-canary-${{ github.run_id }}
          path: |
            canary/outputs/current-head-gate1-proof.json
            canary/outputs/gate1.md
            canary/state/factory-state.json
          if-no-files-found: error
          retention-days: 30
