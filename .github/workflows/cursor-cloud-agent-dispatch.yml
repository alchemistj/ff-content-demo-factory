name: GitHub-native Cursor Cloud Agent dispatch

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Authoritative Content Demo Factory Issue'
        required: true
        type: string
      pr_number:
        description: 'Existing same-lineage PR'
        required: true
        type: string
      branch:
        description: 'Existing same-lineage branch'
        required: true
        type: string
      reviewed_head_sha:
        description: 'Reviewed starting head SHA'
        required: true
        type: string
      scope:
        description: 'Research or implementation scope for Cursor'
        required: true
        type: string
      phase_a_run_id:
        description: 'Existing phase-A workflow run whose sealed handoff is being dispatched'
        required: true
        type: string
  workflow_run:
    workflows: ['Fresh current-head Gate 1 canary']
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: factory-cursor-handoff-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify same-lineage PR target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        run: |
          test "${{ inputs.issue_number }}" = '8'
          test "${{ inputs.pr_number }}" = '1'
          test "$REVIEWED_HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" = "$BRANCH"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$REVIEWED_HEAD_SHA"
      - name: Retrieve and validate the exact phase-A pending handoff
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE_A_RUN_ID: ${{ inputs.phase_a_run_id }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          mkdir -p canary/phase-a
          gh run download "$PHASE_A_RUN_ID" --repo "$REPOSITORY" --name "current-head-gate1-canary-$PHASE_A_RUN_ID" --dir canary/phase-a
          PENDING_FILE=canary/phase-a/current-head-gate1-pending.json PHASE_A_RUN_ID="$PHASE_A_RUN_ID" REVIEWED_HEAD_SHA="$REVIEWED_HEAD_SHA" REPOSITORY="$REPOSITORY" node - <<'NODE'
          const fs=require('node:fs'); const { validatePendingHandoff }=require('./src/factory/handoff');
          const p=JSON.parse(fs.readFileSync(process.env.PENDING_FILE,'utf8'));
          validatePendingHandoff(p,{phaseARunId:process.env.PHASE_A_RUN_ID,checkedOutSha:process.env.REVIEWED_HEAD_SHA,repository:process.env.REPOSITORY,issueNumber:8,prNumber:1});
          if (!p.envelope.sourceManifestDigest) throw new Error('phase-A pending sourceManifestDigest is required');
          fs.writeFileSync('canary/phase-a/pending.checked.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Generate durable @cursor dispatch packet
        env:
          FACTORY_ISSUE_NUMBER: ${{ inputs.issue_number }}
          FACTORY_PR_NUMBER: ${{ inputs.pr_number }}
          FACTORY_BRANCH: ${{ inputs.branch }}
          FACTORY_REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          FACTORY_DISPATCH_SCOPE: ${{ inputs.scope }}
          FACTORY_REPOSITORY: ${{ github.repository }}
          FACTORY_PENDING_FILE: canary/phase-a/pending.checked.json
          FACTORY_DISPATCH_OUTPUT: canary/outputs/cursor-dispatch.json
        run: node src/dispatch-cursor-cloud-agent.js
      - name: Claim durable GitHub ledger before connector dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FILE: canary/outputs/cursor-dispatch.json
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          handoff_key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          handoff_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).handoffId)")"
          phase_run_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).phaseARunId)")"
          input_manifest_digest="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).envelope.inputManifestDigest)")"
          source_manifest_digest="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).envelope.sourceManifestDigest)")"
          dispatch_digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          test -n "$GH_TOKEN"
          comments="$(GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          LEDGER_COMMENTS="$comments" HANDOFF_KEY="$handoff_key" HANDOFF_ID="$handoff_id" PHASE_RUN_ID="$phase_run_id" INPUT_MANIFEST_DIGEST="$input_manifest_digest" SOURCE_MANIFEST_DIGEST="$source_manifest_digest" DISPATCH_DIGEST="$dispatch_digest" REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$ISSUE_NUMBER" PR_NUMBER="$PR_NUMBER" BRANCH="$BRANCH" HEAD_SHA="$REVIEWED_HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs'); const { markerFor, markerBody, findClaim } = require('./src/factory/github-ledger');
          const comments = JSON.parse(process.env.LEDGER_COMMENTS);
          const expected = { repository: process.env.REPOSITORY, issueNumber: '8', prNumber: '1', branch: process.env.BRANCH, checkedOutSha: process.env.HEAD_SHA, kind: 'dispatch', handoffId: process.env.HANDOFF_ID, dispatchKey: process.env.HANDOFF_KEY, dispatchDigest: process.env.DISPATCH_DIGEST, runId: JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json')).envelope.runId, sourceCheckpointDigest: JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json')).envelope.sourceCheckpointDigest, sourceManifestDigest: process.env.SOURCE_MANIFEST_DIGEST, inputManifestDigest: process.env.INPUT_MANIFEST_DIGEST, jobId: process.env.PHASE_RUN_ID, resultId: process.env.DISPATCH_DIGEST };
          const claim = findClaim(comments, expected);
          if (claim && ['posted', 'in_motion', 'terminal', 'resumed'].includes(claim.status)) { fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_LEDGER_ALREADY_CLAIMED=true\n'); process.exit(0); }
          const marker = markerFor({ kind: 'dispatch', repository: process.env.REPOSITORY, issueNumber: process.env.ISSUE_NUMBER, prNumber: process.env.PR_NUMBER, branch: process.env.BRANCH, checkedOutSha: process.env.HEAD_SHA, handoffId: process.env.HANDOFF_ID, dispatchKey: process.env.HANDOFF_KEY, dispatchDigest: process.env.DISPATCH_DIGEST, runId: expected.runId, sourceCheckpointDigest: expected.sourceCheckpointDigest, sourceManifestDigest: process.env.SOURCE_MANIFEST_DIGEST, inputManifestDigest: process.env.INPUT_MANIFEST_DIGEST, jobId: process.env.PHASE_RUN_ID, ownerToken: process.env.HANDOFF_KEY, resultId: process.env.DISPATCH_DIGEST, status: 'preparing' });
          fs.writeFileSync('canary/outputs/cursor-ledger-marker.md', markerBody(marker));
          NODE
      - name: Publish durable dispatch ledger marker
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          test -n "$GH_TOKEN"
          GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/outputs/cursor-ledger-marker.md)"
      - name: Post and record immutable connector-native @cursor dispatch
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PHASE_A_RUN_ID: ${{ inputs.phase_a_run_id }}
          COMMENT_FILE: canary/outputs/cursor-dispatch.comment.md
          DISPATCH_FILE: canary/outputs/cursor-dispatch.json
        run: |
          digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          test -n "$GH_TOKEN"
          GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > canary/outputs/execution-comments.json
          expected="$(DIGEST="$digest" KEY="$key" node -e "process.stdout.write(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,prNumber:process.env.PR_NUMBER,dispatchDigest:process.env.DIGEST,dispatchKey:process.env.KEY}))")"
          prior="$(node scripts/select-cursor-dispatch-comment.js canary/outputs/execution-comments.json "$expected" 2>/dev/null || true)"
          if [ -n "$prior" ]; then
            comment_id="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).id))" "$prior")"
            comment_url="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).html_url)" "$prior")"
            echo "idempotent_existing_comment=$comment_url"
          else
            input_manifest_digest="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).envelope.inputManifestDigest)")"
            handoff_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).handoffId)")"
            { cat "$COMMENT_FILE"; printf 'Handoff ID: %s\\nPhase-A run: %s\\nInput manifest digest: %s\\nDispatch workflow run: %s\\n' "$handoff_id" "$PHASE_A_RUN_ID" "$input_manifest_digest" "$GITHUB_RUN_ID"; } > canary/outputs/cursor-dispatch.post.md
            response="$(GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST -f body="$(cat canary/outputs/cursor-dispatch.post.md)")"
            comment_id="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).id))" "$response")"
            comment_url="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).html_url)" "$response")"
          fi
          test -n "$comment_id"; test -n "$comment_url"
          echo "FACTORY_DISPATCH_COMMENT_ID=$comment_id" >> "$GITHUB_ENV"
          echo "FACTORY_DISPATCH_COMMENT_URL=$comment_url" >> "$GITHUB_ENV"
          COMMENT_URL="$comment_url" COMMENT_ID="$comment_id" DISPATCH_FILE="$DISPATCH_FILE" node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8'));p.commentId=process.env.COMMENT_ID;p.commentUrl=process.env.COMMENT_URL;fs.writeFileSync(process.env.DISPATCH_FILE,JSON.stringify(p,null,2)+'\\n')"
      - name: Record posted ledger state after authoritative @cursor identity
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_FILE: canary/outputs/cursor-dispatch.json
          COMMENT_ID: ${{ env.FACTORY_DISPATCH_COMMENT_ID }}
          COMMENT_URL: ${{ env.FACTORY_DISPATCH_COMMENT_URL }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        run: |
          test -n "$GH_TOKEN"
          node - <<'NODE'
          const fs=require('node:fs'); const { markerFor, markerBody }=require('./src/factory/github-ledger');
          const p=JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8'));
          const pending=JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8'));
          const marker=markerFor({kind:'dispatch',repository:process.env.REPOSITORY,issueNumber:process.env.ISSUE_NUMBER,prNumber:process.env.PR_NUMBER,branch:process.env.BRANCH,checkedOutSha:process.env.HEAD_SHA,handoffId:pending.handoffId,dispatchKey:p.dispatchKey,dispatchDigest:p.dispatchDigest,runId:pending.envelope.runId,prospectId:pending.envelope.prospectId,sourceCheckpointDigest:pending.envelope.sourceCheckpointDigest,sourceManifestDigest:pending.envelope.sourceManifestDigest,inputManifestDigest:pending.envelope.inputManifestDigest,jobId:pending.phaseARunId,ownerToken:p.dispatchKey,resultId:p.dispatchDigest,commentId:process.env.COMMENT_ID,commentUrl:process.env.COMMENT_URL,status:'posted'});
          fs.writeFileSync('canary/outputs/cursor-ledger-posted.md',markerBody(marker));
          NODE
          GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/outputs/cursor-ledger-posted.md)"
      - name: Upload dispatch packet receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-cloud-agent-dispatch-${{ github.run_id }}
          path: canary/outputs/cursor-dispatch.*
          if-no-files-found: error
          retention-days: 30

  automatic-dispatch-from-phase-a:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: factory-cursor-handoff-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout the immutable phase-A head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Retrieve and verify phase-A handoff artifact automatically
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE_A_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p canary/phase-a
          gh run download "$PHASE_A_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "current-head-gate1-canary-$PHASE_A_RUN_ID" --dir canary/phase-a
          if [ ! -f canary/phase-a/current-head-gate1-pending.json ]; then
            echo "Phase-A pending handoff is absent; this workflow_run is not a dispatch-phase artifact"
            echo "FACTORY_SKIP_AUTOMATIC_DISPATCH=true" >> "$GITHUB_ENV"
            exit 0
          fi
          PHASE_A_PENDING=canary/phase-a/current-head-gate1-pending.json node -e "const fs=require('node:fs');const {validatePendingHandoff}=require('./src/factory/handoff');const p=JSON.parse(fs.readFileSync(process.env.PHASE_A_PENDING,'utf8'));if(p.phase!=='awaiting-cursor-receipt') throw new Error('Phase-A pending is not awaiting a Cursor receipt');if(Number(p.dispatchPacket.issueNumber)!==8||Number(p.dispatchPacket.prNumber)!==1) throw new Error('Phase-A pending is not bound to Issue 8 / PR 1');validatePendingHandoff(p,{checkedOutSha:p.envelope.checkedOutSha,inputManifestDigest:p.envelope.inputManifestDigest,phaseARunId:process.env.PHASE_A_RUN_ID,repository:process.env.GITHUB_REPOSITORY,issueNumber:8,prNumber:1});fs.writeFileSync('canary/phase-a/pending.checked.json',JSON.stringify(p,null,2)+'\\n')"
      - name: Generate the verified connector-native packet
        if: env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true'
        env:
          FACTORY_PENDING_FILE: canary/phase-a/pending.checked.json
          FACTORY_DISPATCH_OUTPUT: canary/phase-a/cursor-dispatch.json
          FACTORY_REPOSITORY: ${{ github.repository }}
        run: node src/dispatch-cursor-cloud-agent.js
      - name: Bind dispatch comment to durable handoff identity
        if: env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true'
        run: |
          node -e "const fs=require('node:fs');const pending=JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8'));fs.appendFileSync('canary/phase-a/cursor-dispatch.comment.md','Handoff ID: '+pending.handoffId+'\\nPhase-A run: '+pending.phaseARunId+'\\nInput manifest digest: '+pending.envelope.inputManifestDigest+'\\nDispatch workflow run: '+process.env.GITHUB_RUN_ID+'\\n');"
      - name: Claim durable GitHub ledger before connector dispatch
        if: env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true'
        env:
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          handoff_key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          dispatch_digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          handoff_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).handoffId)")"
          issue_number="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          pr_number="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).prNumber))")"
          branch="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).branch)")"
          head_sha="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8')).envelope.checkedOutSha)")"
          test -n "$GH_TOKEN"
          comments="$(GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$REPOSITORY/issues/$issue_number/comments?per_page=100")"
          LEDGER_COMMENTS="$comments" HANDOFF_KEY="$handoff_key" HANDOFF_ID="$handoff_id" DISPATCH_DIGEST="$dispatch_digest" REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$issue_number" PR_NUMBER="$pr_number" BRANCH="$branch" HEAD_SHA="$head_sha" node - <<'NODE'
          const fs = require('node:fs'); const { markerFor, markerBody, findClaim } = require('./src/factory/github-ledger');
          const comments = JSON.parse(process.env.LEDGER_COMMENTS); const p = JSON.parse(fs.readFileSync('canary/phase-a/cursor-dispatch.json','utf8')); const pending = JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8'));
          const e = pending.envelope;
          const expected = { repository: process.env.REPOSITORY, issueNumber: '8', prNumber: '1', branch: process.env.BRANCH, checkedOutSha: e.checkedOutSha, kind: 'dispatch', handoffId: pending.handoffId, dispatchKey: e.dispatchKey, dispatchDigest: e.dispatchDigest, resultId: e.dispatchDigest, runId: e.runId, prospectId: e.prospectId, sourceCheckpointDigest: e.sourceCheckpointDigest, sourceManifestDigest: e.sourceManifestDigest, inputManifestDigest: e.inputManifestDigest, jobId: pending.phaseARunId };
          const claim = findClaim(comments, expected);
          if (claim && ['posted', 'in_motion', 'terminal', 'resumed'].includes(claim.status)) { fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_LEDGER_ALREADY_CLAIMED=true\n'); process.exit(0); }
          const marker = markerFor({ kind: 'dispatch', repository: process.env.REPOSITORY, issueNumber: '8', prNumber: '1', branch: process.env.BRANCH, checkedOutSha: e.checkedOutSha, handoffId: pending.handoffId, dispatchKey: e.dispatchKey, dispatchDigest: e.dispatchDigest, runId: e.runId, prospectId: e.prospectId, sourceCheckpointDigest: e.sourceCheckpointDigest, sourceManifestDigest: e.sourceManifestDigest, inputManifestDigest: e.inputManifestDigest, jobId: pending.phaseARunId, ownerToken: e.dispatchKey, resultId: e.dispatchDigest, status: 'preparing' }); fs.writeFileSync('canary/phase-a/cursor-ledger-marker.md', markerBody(marker));
          NODE
      - name: Publish durable dispatch ledger marker
        if: env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true' && env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
        run: |
          test -n "$GH_TOKEN"
          ISSUE_NUMBER="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-ledger-marker.md)"
      - name: Post exactly once using durable dispatch CAS
        if: env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true' && env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
        run: |
          test -n "$GH_TOKEN"
          ISSUE_NUMBER="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          PR_NUMBER="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(process.env.DISPATCH_FILE,'utf8')).prNumber))")"
          GH_TOKEN="$GH_TOKEN" gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > canary/phase-a/execution-comments.json
          expected="$(DIGEST="$digest" KEY="$key" node -e "process.stdout.write(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,prNumber:process.env.PR_NUMBER,dispatchDigest:process.env.DIGEST,dispatchKey:process.env.KEY}))")"
          prior="$(node scripts/select-cursor-dispatch-comment.js canary/phase-a/execution-comments.json "$expected" 2>/dev/null || true)"
          if [ -n "$prior" ]; then comment_id="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).id))" "$prior")"; comment_url="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).html_url)" "$prior")"; else response="$(GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-dispatch.comment.md)")"; comment_id="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).id))" "$response")"; comment_url="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).html_url)" "$response")"; fi
          test -n "$comment_id"; test -n "$comment_url"
          echo "FACTORY_DISPATCH_COMMENT_ID=$comment_id" >> "$GITHUB_ENV"
          echo "FACTORY_DISPATCH_COMMENT_URL=$comment_url" >> "$GITHUB_ENV"
          COMMENT_URL="$comment_url" DISPATCH_FILE="$DISPATCH_FILE" node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8'));p.commentUrl=process.env.COMMENT_URL;fs.writeFileSync(process.env.DISPATCH_FILE,JSON.stringify(p,null,2)+'\\n')"
      - name: Record automatic posted ledger state
        if: env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true' && env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
          COMMENT_ID: ${{ env.FACTORY_DISPATCH_COMMENT_ID }}
          COMMENT_URL: ${{ env.FACTORY_DISPATCH_COMMENT_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          ISSUE_NUMBER="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          node - <<'NODE'
          const fs=require('node:fs'); const { markerFor, markerBody }=require('./src/factory/github-ledger');
          const p=JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')); const pending=JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8'));
          const marker=markerFor({kind:'dispatch',repository:process.env.REPOSITORY,issueNumber:p.issueNumber,prNumber:p.prNumber,branch:p.branch,checkedOutSha:pending.envelope.checkedOutSha,handoffId:pending.handoffId,dispatchKey:p.dispatchKey,dispatchDigest:p.dispatchDigest,runId:pending.envelope.runId,prospectId:pending.envelope.prospectId,sourceCheckpointDigest:pending.envelope.sourceCheckpointDigest,sourceManifestDigest:pending.envelope.sourceManifestDigest,inputManifestDigest:pending.envelope.inputManifestDigest,jobId:pending.phaseARunId,ownerToken:p.dispatchKey,resultId:p.dispatchDigest,commentId:process.env.COMMENT_ID,commentUrl:process.env.COMMENT_URL,status:'posted'});
          fs.writeFileSync('canary/phase-a/cursor-ledger-posted.md',markerBody(marker));
          NODE
          GH_TOKEN="$GH_TOKEN" gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-ledger-posted.md)"
      - name: Upload automatic dispatch receipt
        if: always() && env.FACTORY_SKIP_AUTOMATIC_DISPATCH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-cloud-agent-dispatch-${{ github.run_id }}
          path: canary/phase-a/*
          if-no-files-found: error
          retention-days: 30
