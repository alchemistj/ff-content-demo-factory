name: GitHub-native Cursor Cloud Agent dispatch

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Authoritative Content Demo Factory Issue'
        required: true
        type: string
      pr_number:
        description: 'Existing same-lineage PR'
        required: true
        type: string
      branch:
        description: 'Existing same-lineage branch'
        required: true
        type: string
      reviewed_head_sha:
        description: 'Reviewed starting head SHA'
        required: true
        type: string
      scope:
        description: 'Research or implementation scope for Cursor'
        required: true
        type: string
  workflow_run:
    workflows: ['Fresh current-head Gate 1 canary']
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: factory-cursor-handoff-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify same-lineage PR target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        run: |
          test "$REVIEWED_HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" = "$BRANCH"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$REVIEWED_HEAD_SHA"
      - name: Generate durable @cursor dispatch packet
        env:
          FACTORY_ISSUE_NUMBER: ${{ inputs.issue_number }}
          FACTORY_PR_NUMBER: ${{ inputs.pr_number }}
          FACTORY_BRANCH: ${{ inputs.branch }}
          FACTORY_REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          FACTORY_DISPATCH_SCOPE: ${{ inputs.scope }}
          FACTORY_REPOSITORY: ${{ github.repository }}
          FACTORY_DISPATCH_OUTPUT: canary/outputs/cursor-dispatch.json
        run: node src/dispatch-cursor-cloud-agent.js
      - name: Claim durable GitHub ledger before connector dispatch
        env:
          DISPATCH_FILE: canary/outputs/cursor-dispatch.json
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          handoff_key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          dispatch_digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          LEDGER_COMMENTS="$comments" HANDOFF_KEY="$handoff_key" DISPATCH_DIGEST="$dispatch_digest" REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$ISSUE_NUMBER" PR_NUMBER="$PR_NUMBER" BRANCH="$BRANCH" HEAD_SHA="$REVIEWED_HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs'); const { markerFor, markerBody, findClaim } = require('./src/factory/github-ledger');
          const comments = JSON.parse(process.env.LEDGER_COMMENTS);
          const expected = { repository: process.env.REPOSITORY, issueNumber: process.env.ISSUE_NUMBER, kind: 'dispatch', handoffId: process.env.HANDOFF_KEY, dispatchKey: process.env.HANDOFF_KEY, resultId: process.env.DISPATCH_DIGEST };
          if (findClaim(comments, expected)) { fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_LEDGER_ALREADY_CLAIMED=true\n'); process.exit(0); }
          const marker = markerFor({ kind: 'dispatch', repository: process.env.REPOSITORY, issueNumber: process.env.ISSUE_NUMBER, prNumber: process.env.PR_NUMBER, branch: process.env.BRANCH, checkedOutSha: process.env.HEAD_SHA, handoffId: process.env.HANDOFF_KEY, dispatchKey: process.env.HANDOFF_KEY, resultId: process.env.DISPATCH_DIGEST });
          fs.writeFileSync('canary/outputs/cursor-ledger-marker.md', markerBody(marker));
          NODE
      - name: Publish durable dispatch ledger marker
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/outputs/cursor-ledger-marker.md)"
      - name: Post and record immutable connector-native @cursor dispatch
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_FILE: canary/outputs/cursor-dispatch.comment.md
          DISPATCH_FILE: canary/outputs/cursor-dispatch.json
        run: |
          digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          prior="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[] | [.html_url, .body] | @tsv' | awk -v digest="$digest" -v key="$key" 'index($0, digest) || index($0, key) {print $1; exit}')"
          if [ -n "$prior" ]; then
            comment_url="$prior"
            echo "idempotent_existing_comment=$comment_url"
          else
            { cat "$COMMENT_FILE"; printf 'Dispatch workflow run: %s\\n' "$GITHUB_RUN_ID"; } > canary/outputs/cursor-dispatch.post.md
            comment_url="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/outputs/cursor-dispatch.post.md)" --jq .html_url)"
          fi
          COMMENT_URL="$comment_url" DISPATCH_FILE="$DISPATCH_FILE" node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8'));p.commentUrl=process.env.COMMENT_URL;fs.writeFileSync(process.env.DISPATCH_FILE,JSON.stringify(p,null,2)+'\\n')"
      - name: Upload dispatch packet receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-cloud-agent-dispatch-${{ github.run_id }}
          path: canary/outputs/cursor-dispatch.*
          if-no-files-found: error
          retention-days: 30

  automatic-dispatch-from-phase-a:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: factory-cursor-handoff-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout the immutable phase-A head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Retrieve and verify phase-A handoff artifact automatically
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE_A_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p canary/phase-a
          gh run download "$PHASE_A_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "current-head-gate1-canary-$PHASE_A_RUN_ID" --dir canary/phase-a
          test -f canary/phase-a/current-head-gate1-pending.json
          PHASE_A_PENDING=canary/phase-a/current-head-gate1-pending.json node -e "const fs=require('node:fs');const {validatePendingHandoff}=require('./src/factory/handoff');const p=JSON.parse(fs.readFileSync(process.env.PHASE_A_PENDING,'utf8'));validatePendingHandoff(p,{checkedOutSha:p.envelope.checkedOutSha,inputManifestDigest:p.envelope.inputManifestDigest});fs.writeFileSync('canary/phase-a/pending.checked.json',JSON.stringify(p,null,2)+'\\n')"
      - name: Generate the verified connector-native packet
        env:
          FACTORY_PENDING_FILE: canary/phase-a/pending.checked.json
          FACTORY_DISPATCH_OUTPUT: canary/phase-a/cursor-dispatch.json
          FACTORY_REPOSITORY: ${{ github.repository }}
        run: node src/dispatch-cursor-cloud-agent.js
      - name: Bind dispatch comment to durable handoff identity
        run: |
          node -e "const fs=require('node:fs');const pending=JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8'));fs.appendFileSync('canary/phase-a/cursor-dispatch.comment.md','Handoff ID: '+pending.handoffId+'\\nPhase-A run: '+pending.phaseARunId+'\\nDispatch workflow run: '+process.env.GITHUB_RUN_ID+'\\n');"
      - name: Claim durable GitHub ledger before connector dispatch
        env:
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          handoff_key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          dispatch_digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          handoff_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('canary/phase-a/pending.checked.json','utf8')).handoffId)")"
          issue_number="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          pr_number="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).prNumber))")"
          branch="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).branch)")"
          head_sha="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync('canary/phase-a/pending.checked.json','utf8')).envelope.checkedOutSha)")"
          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$issue_number/comments?per_page=100")"
          LEDGER_COMMENTS="$comments" HANDOFF_KEY="$handoff_key" HANDOFF_ID="$handoff_id" DISPATCH_DIGEST="$dispatch_digest" REPOSITORY="$REPOSITORY" ISSUE_NUMBER="$issue_number" PR_NUMBER="$pr_number" BRANCH="$branch" HEAD_SHA="$head_sha" node - <<'NODE'
          const fs = require('node:fs'); const { markerFor, markerBody, findClaim } = require('./src/factory/github-ledger');
          const comments = JSON.parse(process.env.LEDGER_COMMENTS); const expected = { repository: process.env.REPOSITORY, issueNumber: process.env.ISSUE_NUMBER, kind: 'dispatch', handoffId: process.env.HANDOFF_ID, dispatchKey: process.env.HANDOFF_KEY, resultId: process.env.DISPATCH_DIGEST };
          if (findClaim(comments, expected)) { fs.appendFileSync(process.env.GITHUB_ENV, 'FACTORY_LEDGER_ALREADY_CLAIMED=true\n'); process.exit(0); }
          const marker = markerFor({ kind: 'dispatch', repository: process.env.REPOSITORY, issueNumber: process.env.ISSUE_NUMBER, prNumber: process.env.PR_NUMBER, branch: process.env.BRANCH, checkedOutSha: process.env.HEAD_SHA, handoffId: process.env.HANDOFF_ID, dispatchKey: process.env.HANDOFF_KEY, resultId: process.env.DISPATCH_DIGEST }); fs.writeFileSync('canary/phase-a/cursor-ledger-marker.md', markerBody(marker));
          NODE
      - name: Publish durable dispatch ledger marker
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
        run: |
          ISSUE_NUMBER="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-ledger-marker.md)"
      - name: Post exactly once using durable dispatch CAS
        if: env.FACTORY_LEDGER_ALREADY_CLAIMED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FILE: canary/phase-a/cursor-dispatch.json
        run: |
          ISSUE_NUMBER="$(node -e "const fs=require('node:fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).issueNumber))")"
          digest="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchDigest)")"
          key="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8')).dispatchKey)")"
          prior="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[] | [.html_url, .body] | @tsv' | awk -v digest="$digest" -v key="$key" 'index($0, digest) || index($0, key) {print $1; exit}')"
          if [ -n "$prior" ]; then comment_url="$prior"; else comment_url="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --method POST -f body="$(cat canary/phase-a/cursor-dispatch.comment.md)" --jq .html_url)"; fi
          COMMENT_URL="$comment_url" DISPATCH_FILE="$DISPATCH_FILE" node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE,'utf8'));p.commentUrl=process.env.COMMENT_URL;fs.writeFileSync(process.env.DISPATCH_FILE,JSON.stringify(p,null,2)+'\\n')"
      - name: Upload automatic dispatch receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-cloud-agent-dispatch-${{ github.run_id }}
          path: canary/phase-a/*
          if-no-files-found: error
          retention-days: 30
