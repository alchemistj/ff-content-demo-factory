name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  writer-guides:
    name: Factory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and source tests
        run: npm run check && npm test

      - name: Compiled package acceptance
        run: npm run test:compiled

      - name: Demo gate (changed demo folders)
        if: github.event_name == 'pull_request'
        run: node scripts/gate.mjs --allow-logged --changed "origin/${{ github.base_ref }}"
